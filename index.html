
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Surfer 3D</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Orbitron', sans-serif;
            touch-action: none; /* Prevents default touch actions */
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        #score-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: right;
        }

        .hud-label {
            font-size: 12px;
            color: #ff00de;
            display: block;
        }

        #start-screen, #game-over-screen {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            border-radius: 10px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 40px;
            margin: 0 0 20px 0;
            background: -webkit-linear-gradient(#ff00de, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            background: transparent;
            color: #fff;
            border: 2px solid #ff00de;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 10px #ff00de;
        }

        button:active {
            background: #ff00de;
            box-shadow: 0 0 20px #ff00de;
        }

        #controls-hint {
            margin-top: 20px;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
        }
        
        .key {
            display: inline-block;
            border: 1px solid #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin: 0 2px;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="score-hud">
                <span class="hud-label">SCORE</span>
                <span id="score-display">0</span>
            </div>

            <div id="start-screen">
                <h1>CYBER SURFER</h1>
                <p>Dodge the data blocks. Collect the cores.</p>
                <div id="controls-hint">
                    PC: <span class="key">←</span> <span class="key">→</span> to Move, <span class="key">SPACE</span> to Jump<br>
                    MOBILE: Swipe Left/Right/Up
                </div>
                <button id="start-btn">INITIATE RUN</button>
            </div>

            <div id="game-over-screen" class="hidden">
                <h1>SYSTEM CRASH</h1>
                <p>FINAL SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn">REBOOT</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ENGINE CONFIGURATION
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize rendering
        
        // Game State
        let isRunning = false;
        let score = 0;
        let speed = 0;
        let frameCount = 0;

        // 3D Projection Constants
        let fov = 300; // Field of view
        const laneWidth = 120; // World units
        const cameraHeight = 150;
        const cameraDepth = 20;

        // Player State
        const player = {
            lane: 0, // -1 (Left), 0 (Center), 1 (Right)
            x: 0,    // Interpolated X for smoothness
            y: 0,    // Vertical position (for jumping)
            z: cameraDepth + 50,
            width: 40,
            height: 60,
            dy: 0,
            gravity: 1.5,
            jumpForce: 25,
            grounded: true,
            color: '#00ffcc'
        };

        const world = {
            friction: 0.9,
            baseSpeed: 15,
            maxSpeed: 40,
            segments: [],
            objects: [] // Obstacles and coins
        };

        // UI References
        const scoreEl = document.getElementById('score-display');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        
        // Resize Handler
        let cx, cy;
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            cx = canvas.width / 2;
            cy = canvas.height / 2;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        /**
         * SOUND SYNTHESIZER (Same tech as previous game)
         */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function sfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.setValueAtTime(1800, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        /**
         * GAME LOGIC
         */

        function spawnObject() {
            // Z position is far in the distance
            const spawnZ = 4000;
            
            // Random Lane: -1, 0, or 1
            const rLane = Math.floor(Math.random() * 3) - 1; 

            const type = Math.random() > 0.3 ? 'obstacle' : 'coin';

            world.objects.push({
                x: rLane * laneWidth, // World X
                y: 0,                 // World Y (0 is floor)
                z: spawnZ,            // World Z
                lane: rLane,
                type: type,
                active: true,
                // Visual properties
                w: type === 'obstacle' ? 70 : 30,
                h: type === 'obstacle' ? 80 : 30,
                col: type === 'obstacle' ? '#ff0055' : '#ffd700'
            });
        }

        function update() {
            // Speed progression
            if (speed < world.maxSpeed) speed += 0.005;

            // Player Physics
            // Smooth lane changing (Lerp)
            const targetX = player.lane * laneWidth;
            player.x += (targetX - player.x) * 0.15;

            // Gravity
            if (!player.grounded) {
                player.dy -= player.gravity;
                player.y += player.dy;
                if (player.y <= 0) {
                    player.y = 0;
                    player.dy = 0;
                    player.grounded = true;
                }
            }

            // Move Objects towards player
            for (let i = world.objects.length - 1; i >= 0; i--) {
                let obj = world.objects[i];
                obj.z -= speed;

                // Collision Detection
                // Check Z depth overlap (approximated)
                if (obj.active && obj.z < player.z + 20 && obj.z > player.z - 20) {
                    
                    // Check Lane overlap (roughly)
                    // We check if the visual X is close enough
                    if (Math.abs(obj.x - player.x) < 50) {
                        
                        // Check Vertical overlap (Jump over obstacles)
                        // Player Y is height from ground. Obj Y is usually 0.
                        if (obj.type === 'obstacle') {
                            if (player.y < obj.h) {
                                gameOver();
                            }
                        } else if (obj.type === 'coin') {
                            // Collect coin logic
                            // If player is touching coin (coins are floating or on ground? Lets put them on ground for now)
                            // Basic 3D cube collision check
                            if (player.y < obj.h + 20) {
                                score += 10;
                                scoreEl.innerText = score;
                                sfx('coin');
                                obj.active = false; // Disable coin
                            }
                        }
                    }
                }

                // Remove objects behind camera
                if (obj.z < -fov) {
                    world.objects.splice(i, 1);
                }
            }

            // Clean up inactive coins
            world.objects = world.objects.filter(o => o.active);

            // Spawning Logic
            if (frameCount % Math.floor(2500 / speed) === 0) {
                spawnObject();
            }

            frameCount++;
        }

        /**
         * RENDERER (Pseudo-3D)
         */
        function project(x, y, z) {
            // Basic perspective projection formula
            // Avoid division by zero
            if (z < -fov + 1) z = -fov + 1;
            
            const scale = fov / (fov + z);
            const screenX = cx + (x * scale);
            const screenY = cy - (cameraHeight * scale) - (y * scale);
            
            return { x: screenX, y: screenY, s: scale };
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Floor Grid (The "Synthwave" Grid)
            // We draw lines moving towards camera
            const floorY = cy + 20; // Horizon offset
            
            // Draw Horizon
            let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0f0c29');
            grad.addColorStop(0.5, '#302b63');
            grad.addColorStop(1, '#111');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw Moving Floor Lines (Horizontal)
            ctx.strokeStyle = 'rgba(255, 0, 222, 0.3)';
            ctx.lineWidth = 2;
            
            let offset = (frameCount * speed) % 100; // Moving texture effect
            for (let z = 0; z < 4000; z += 100) {
                let p1 = project(-1000, 0, z - offset);
                let p2 = project(1000, 0, z - offset);
                
                // Only draw if below horizon
                if (p1.y > cy) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }

            // Draw Lane Lines (Vertical)
            ctx.strokeStyle = 'rgba(0, 255, 204, 0.3)';
            [-1.5, -0.5, 0.5, 1.5].forEach(laneMult => {
                let pStart = project(laneMult * laneWidth, 0, 0);
                let pEnd = project(laneMult * laneWidth, 0, 4000);
                ctx.beginPath();
                ctx.moveTo(pStart.x, pStart.y);
                ctx.lineTo(pEnd.x, pEnd.y);
                ctx.stroke();
            });

            // Painter's Algorithm: Sort objects by Z (furthest first) so they overlap correctly
            const renderList = [...world.objects];
            
            // Add Player to render list as a standard object for sorting
            renderList.push({
                isPlayer: true,
                x: player.x,
                y: player.y,
                z: player.z,
                w: player.width,
                h: player.height,
                col: player.color
            });

            renderList.sort((a, b) => b.z - a.z);

            // Draw All Objects
            renderList.forEach(obj => {
                const p = project(obj.x, obj.y, obj.z);
                const width = obj.w * p.s;
                const height = obj.h * p.s;

                // Calculate color intensity based on distance (Fog effect)
                ctx.globalAlpha = Math.min(1, 400 / (obj.z + 1));

                if (obj.type === 'coin') {
                    // Draw Coin (Circle/Spinning)
                    ctx.fillStyle = obj.col;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y - height/2, width/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    // Draw Cube/Rect Face
                    ctx.fillStyle = obj.col;
                    ctx.fillRect(p.x - width/2, p.y - height, width, height);
                    
                    // Simple shading (Side)
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(p.x - width/2, p.y - height, width/4, height);
                }

                // Shadow
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = '#000';
                const shadowW = width * 0.8;
                const shadowH = width * 0.2;
                // Shadow projected on floor
                const pFloor = project(obj.x, 0, obj.z); 
                ctx.beginPath();
                ctx.ellipse(pFloor.x, pFloor.y, shadowW, shadowH, 0, 0, Math.PI*2);
                ctx.fill();

                ctx.globalAlpha = 1.0;
            });
        }

        function loop() {
            if (!isRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        /**
         * CONTROLS & STATE MANAGEMENT
         */
        function startGame() {
            // Reset
            player.lane = 0;
            player.x = 0;
            player.y = 0;
            player.z = cameraDepth + 50;
            score = 0;
            speed = world.baseSpeed;
            world.objects = [];
            
            scoreEl.innerText = "0";
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreEl.parentElement.classList.remove('hidden');
            
            isRunning = true;
            loop();
        }

        function gameOver() {
            isRunning = false;
            sfx('crash');
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
            scoreEl.parentElement.classList.add('hidden');
        }

        function handleInput(action) {
            if (!isRunning) return;

            if (action === 'left' && player.lane > -1) {
                player.lane--;
            }
            if (action === 'right' && player.lane < 1) {
                player.lane++;
            }
            if (action === 'jump' && player.grounded) {
                player.grounded = false;
                player.dy = player.jumpForce;
                sfx('jump');
            }
        }

        // Keyboard
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.key === 'a') handleInput('left');
            if (e.code === 'ArrowRight' || e.key === 'd') handleInput('right');
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
                if(isRunning) handleInput('jump');
                else startGame();
            }
        });

        // Touch / Swipe
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            if (!isRunning) return;
            
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // Horizontal Swipe
                if (Math.abs(dx) > 30) {
                    if (dx > 0) handleInput('right');
                    else handleInput('left');
                }
            } else {
                // Vertical Swipe
                if (dy < -30) handleInput('jump'); // Swipe Up
            }
        }, {passive: false});

        // Button Listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

    </script>
</body>
</html>
