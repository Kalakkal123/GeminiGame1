<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subway Runner 3D</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; font-family: Arial; }
    #renderCanvas { width: 100%; height: 100%; touch-action: none; display:block; }

    /* HUD */
    .hud {
      position: absolute; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .hudBox{
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 10px 14px;
      color: #fff;
      min-width: 120px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    .hudBox b{ font-size: 13px; opacity: 0.9; display:block; }
    .hudBox span{ font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }

    /* Mobile hint */
    #hint {
      position:absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 10px 14px;
      background: rgba(0,0,0,0.35);
      border-radius: 999px;
      color:#fff;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      z-index: 10;
    }

    /* Game over */
    #overlay {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.55);
      z-index: 20;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #overlay.show{ opacity:1; pointer-events: auto; }
    .panel{
      width:min(520px, 92vw);
      background: rgba(20,20,20,0.85);
      border:1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      padding: 22px;
      color:#fff;
      text-align:center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .panel h1{ margin: 0 0 10px; font-size: 28px; }
    .panel p{ margin: 8px 0; opacity: 0.9; }
    .btn{
      margin-top: 14px;
      padding: 12px 18px;
      border-radius: 14px;
      border: none;
      background: #ffffff;
      color:#111;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hudBox"><b>SCORE</b><span id="score">0</span></div>
    <div class="hudBox"><b>COINS</b><span id="coins">0</span></div>
    <div class="hudBox"><b>HIGH SCORE</b><span id="high">0</span></div>
  </div>

  <div id="hint">Swipe / Arrow Keys: ← → lane | ↑ jump | ↓ slide</div>

  <div id="overlay">
    <div class="panel">
      <h1>Game Over</h1>
      <p>Score: <b id="finalScore">0</b></p>
      <p>Coins: <b id="finalCoins">0</b></p>
      <button class="btn" id="restartBtn">Restart</button>
    </div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <!-- Babylon.js -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

  <script src="./game.js"></script>
</body>
</html>
