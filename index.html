<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Subway Surfers Mobile Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: 'Segoe UI', sans-serif; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        #stats-bar {
            display: flex; justify-content: space-around;
            padding: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
            color: #fff; text-shadow: 2px 2px 0 #000;
            font-size: 1.2rem; font-weight: 800;
        }

        #start-screen, #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 100; pointer-events: auto;
        }

        h1 { margin: 0 0 10px 0; font-size: 3rem; color: #ffcc00; text-transform: uppercase; font-style: italic; text-shadow: 4px 4px 0 #d35400; }
        p { font-size: 1.2rem; color: #ddd; margin-bottom: 30px; }
        
        .btn {
            background: linear-gradient(#ffcc00, #ffaa00);
            border: 4px solid #fff;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #4b2e00;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 0 #c68e17, 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 5px 0 #c68e17; }
        
        #controls-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.5); font-size: 0.9rem;
        }

        .hud-value { color: #ffcc00; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="stats-bar">
            <div>SCORE: <span id="score" class="hud-value">0</span></div>
            <div>COINS: <span id="coins" class="hud-value">0</span></div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Subway Run 3D</h1>
        <p>Swipe to Move &bull; Jump &bull; Roll</p>
        <button class="btn" onclick="startGame()">TAP TO PLAY</button>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>BUSTED!</h1>
        <p>Score: <span id="final-score">0</span></p>
        <button class="btn" onclick="resetGame()">RUN AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- CONFIGURATION ---
        const LANE_WIDTH = 3.5;
        const GRAVITY = -45;
        const JUMP_FORCE = 18;
        const SPEED_BASE = 20;
        const SPEED_MAX = 50;

        // --- GLOBALS ---
        let scene, camera, renderer;
        let player, playerMesh, chaseCam;
        let clock = new THREE.Clock();
        
        // Game State
        let isPlaying = false;
        let gameSpeed = SPEED_BASE;
        let score = 0;
        let coinCount = 0;
        let distanceTraveled = 0;

        // Player Physics
        let currentLane = 0; // -1, 0, 1
        let targetX = 0;
        let verticalVelocity = 0;
        let isJumping = false;
        let isRolling = false;
        
        // World Generation
        const chunkLength = 40;
        let renderDistance = 200;
        let spawnZ = 0; // Where to spawn next chunk
        let objects = []; // Obstacles and coins to update/collide
        let chunks = []; // Track segments to cleanup

        // Colors
        const COLOR_SKY = 0x87CEEB;
        const COLOR_GROUND = 0xE0C890; 
        
        // Input Handling
        let touchStartX = 0;
        let touchStartY = 0;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(COLOR_SKY);
            scene.fog = new THREE.Fog(COLOR_SKY, 30, 150);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
            camera.position.set(0, 7, 8);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6); // Sky/Ground ambient
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 50, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // Create Player
            createPlayer();

            // Initial World Generation
            for(let i=0; i<5; i++) {
                spawnChunk(false); // No obstacles in first few chunks
            }
            for(let i=0; i<10; i++) {
                spawnChunk(true);
            }

            // Event Listeners
            window.addEventListener('resize', onResize, false);
            document.addEventListener('keydown', handleKey);
            
            // Touch Events
            document.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, {passive: false});

            document.addEventListener('touchend', e => {
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
            }, {passive: false});

            animate();
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Detailed Character using Primitives
            const matBody = new THREE.MeshStandardMaterial({ color: 0xff3333, roughness: 0.1 }); // Shiny Red Jacket
            const matSkin = new THREE.MeshStandardMaterial({ color: 0xffccaa });
            const matJeans = new THREE.MeshStandardMaterial({ color: 0x3366cc, roughness: 0.8 });
            
            // Torso
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 0.5), matBody);
            torso.position.y = 1.2;
            torso.castShadow = true;
            player.add(torso);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matSkin);
            head.position.y = 1.95;
            head.castShadow = true;
            player.add(head);

            // Cap
            const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.1, 0.6), new THREE.MeshStandardMaterial({color:0x222222}));
            cap.position.set(0, 2.25, 0.05);
            player.add(cap);
            const brim = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.05, 0.3), new THREE.MeshStandardMaterial({color:0x222222}));
            brim.position.set(0, 2.2, -0.4);
            player.add(brim);

            // Legs (Visual only)
            const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.3), matJeans);
            legL.position.set(-0.2, 0.4, 0);
            legL.castShadow = true;
            player.add(legL);

            const legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.3), matJeans);
            legR.position.set(0.2, 0.4, 0);
            legR.castShadow = true;
            player.add(legR);

            playerMesh = player; // Reference for animation
            scene.add(player);
        }

        function spawnChunk(hasObstacles) {
            // 1. Create Ground
            const groundGeo = new THREE.PlaneGeometry(30, chunkLength);
            const groundMat = new THREE.MeshStandardMaterial({ color: COLOR_GROUND });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.set(0, 0, spawnZ - chunkLength/2);
            ground.receiveShadow = true;
            scene.add(ground);
            chunks.push(ground);

            // 2. Create Tracks (3 Lanes)
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });

            [-1, 0, 1].forEach(lane => {
                const x = lane * LANE_WIDTH;
                // Gravel Bed
                const bed = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, chunkLength), trackMat);
                bed.position.set(x, 0.05, spawnZ - chunkLength/2);
                bed.receiveShadow = true;
                scene.add(bed);
                chunks.push(bed);
                
                // Rails
                const railL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, chunkLength), railMat);
                railL.position.set(x - 0.6, 0.15, spawnZ - chunkLength/2);
                scene.add(railL);
                chunks.push(railL);

                const railR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, chunkLength), railMat);
                railR.position.set(x + 0.6, 0.15, spawnZ - chunkLength/2);
                scene.add(railR);
                chunks.push(railR);
            });

            // 3. Environment (Buildings)
            if (Math.random() > 0.3) {
                const bHeight = 10 + Math.random() * 20;
                const bGeo = new THREE.BoxGeometry(8, bHeight, chunkLength);
                const bMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0xccaa88 : 0xaa88cc });
                
                const bLeft = new THREE.Mesh(bGeo, bMat);
                bLeft.position.set(-15, bHeight/2, spawnZ - chunkLength/2);
                scene.add(bLeft);
                chunks.push(bLeft);

                const bRight = new THREE.Mesh(bGeo, bMat);
                bRight.position.set(15, bHeight/2, spawnZ - chunkLength/2);
                scene.add(bRight);
                chunks.push(bRight);
            }

            // 4. Obstacles & Coins
            if (hasObstacles) {
                // Determine pattern for this chunk
                // Simple logic: Pick a lane for an obstacle, other lanes get coins
                const obstacleLane = Math.floor(Math.random() * 3) - 1;
                const obsType = Math.random(); // 0-0.4 Train, 0.4-0.7 Barrier, 0.7-1.0 High Barrier
                
                const zPos = spawnZ - (Math.random() * chunkLength);

                // Spawn Obstacle
                if (obsType < 0.4) spawnTrain(obstacleLane, zPos);
                else spawnBarrier(obstacleLane, zPos, obsType > 0.7);

                // Spawn Coins in free lanes
                [-1, 0, 1].forEach(l => {
                    if (l !== obstacleLane) {
                        spawnCoins(l, zPos);
                    }
                });
            }

            spawnZ -= chunkLength;
        }

        function spawnTrain(lane, z) {
            const group = new THREE.Group();
            
            // Body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(2.6, 4, 12),
                new THREE.MeshStandardMaterial({ color: 0xB22222, roughness: 0.2 })
            );
            body.position.y = 2;
            body.castShadow = true;
            group.add(body);
            
            // Window
            const win = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, 1.5, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x87CEEB, emissive: 0x224466 })
            );
            win.position.set(0, 2.5, 6);
            group.add(win);

            // Light
            const light = new THREE.PointLight(0xffaa00, 2, 15);
            light.position.set(0, 1, 6.5);
            group.add(light);

            group.position.set(lane * LANE_WIDTH, 0, z);
            group.userData = { type: 'kill' }; // Tag for collision
            
            scene.add(group);
            objects.push(group);
        }

        function spawnBarrier(lane, z, isHigh) {
            const h = isHigh ? 2.5 : 1.2; // High requires slide, Low requires jump
            const geo = new THREE.BoxGeometry(2.8, h, 0.5);
            const mat = new THREE.MeshStandardMaterial({ color: 0xdd8800, map: null });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(lane * LANE_WIDTH, h/2, z);
            mesh.castShadow = true;
            mesh.userData = { type: 'kill' };
            if (isHigh) mesh.position.y += 1.5; // Raised barrier, must roll
            
            scene.add(mesh);
            objects.push(mesh);
        }

        function spawnCoins(lane, z) {
            for(let i=0; i<3; i++) {
                const geo = new THREE.TorusGeometry(0.3, 0.1, 8, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(lane * LANE_WIDTH, 1.2, z - (i*2));
                mesh.userData = { type: 'coin' };
                scene.add(mesh);
                objects.push(mesh);
            }
        }

        // --- CONTROLS ---

        function handleKey(e) {
            if (!isPlaying) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') jump();
            if (e.key === 'ArrowDown' || e.key === 's') roll();
        }

        function handleSwipe(x1, y1, x2, y2) {
            if (!isPlaying) return;
            const dx = x2 - x1;
            const dy = y2 - y1;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < 20) return; // Tap, ignore

            if (absDx > absDy) {
                // Horizontal
                if (dx > 0) moveLane(1);
                else moveLane(-1);
            } else {
                // Vertical
                if (dy < 0) jump(); // Swipe UP
                else roll();        // Swipe DOWN
            }
        }

        function moveLane(dir) {
            const newLane = currentLane + dir;
            if (newLane >= -1 && newLane <= 1) {
                currentLane = newLane;
                targetX = currentLane * LANE_WIDTH;
            }
        }

        function jump() {
            if (!isJumping && !isRolling) {
                verticalVelocity = JUMP_FORCE;
                isJumping = true;
            }
        }

        function roll() {
            if (!isJumping && !isRolling) {
                isRolling = true;
                playerMesh.scale.y = 0.5; // Squash
                playerMesh.position.y = 0.5;
                setTimeout(() => {
                    isRolling = false;
                    playerMesh.scale.y = 1;
                    playerMesh.position.y = 0; // Handled by physics loop actually
                }, 800);
            } else if (isJumping) {
                verticalVelocity = -30; // Fast drop
            }
        }

        // --- GAME LOOP ---

        function update(delta) {
            // 1. Movement Forward
            const moveZ = gameSpeed * delta;
            player.position.z -= moveZ;
            distanceTraveled += moveZ;
            score = Math.floor(distanceTraveled / 5);
            document.getElementById('score').innerText = score;

            // Speed up gradually
            if (gameSpeed < SPEED_MAX) gameSpeed += 0.5 * delta;

            // 2. Lane Smoothing (Lerp)
            player.position.x += (targetX - player.position.x) * 10 * delta;

            // 3. Jump Physics
            if (isJumping) {
                player.position.y += verticalVelocity * delta;
                verticalVelocity += GRAVITY * delta;
                
                // Ground detection
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                    verticalVelocity = 0;
                }
            } else if (!isRolling) {
                // Bobbing animation
                playerMesh.position.y = Math.sin(clock.elapsedTime * 15) * 0.1;
            }

            // 4. Camera Follow
            camera.position.z = player.position.z + 8;
            camera.position.x += (player.position.x * 0.5 - camera.position.x) * 5 * delta; // Slight horizontal lag
            camera.lookAt(player.position.x * 0.2, 1, player.position.z - 10); // Look ahead

            // 5. Endless World Gen
            if (player.position.z < spawnZ + renderDistance) {
                spawnChunk(true);
            }

            // 6. Collision & Cleanup
            checkCollisions();
            cleanup();
        }

        function checkCollisions() {
            const pBox = new THREE.Box3().setFromObject(player);
            // Shrink collider slightly to be forgiving
            pBox.expandByScalar(-0.3);

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                const oBox = new THREE.Box3().setFromObject(obj);

                if (pBox.intersectsBox(oBox)) {
                    if (obj.userData.type === 'coin') {
                        // Collect Coin
                        scene.remove(obj);
                        objects.splice(i, 1);
                        coinCount++;
                        document.getElementById('coins').innerText = coinCount;
                    } else if (obj.userData.type === 'kill') {
                        gameOver();
                    }
                }
                
                // Rotate Coins
                if (obj.userData.type === 'coin') obj.rotation.y += 0.1;
            }
        }

        function cleanup() {
            // Remove objects behind camera
            for(let i=objects.length-1; i>=0; i--) {
                if(objects[i].position.z > player.position.z + 20) {
                    scene.remove(objects[i]);
                    objects.splice(i, 1);
                }
            }
            // Remove chunks
            for(let i=chunks.length-1; i>=0; i--) {
                if(chunks[i].position.z > player.position.z + 20) {
                    scene.remove(chunks[i]);
                    chunks.splice(i, 1);
                }
            }
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'none';
        }

        function resetGame() {
            // Clear Scene
            objects.forEach(o => scene.remove(o));
            chunks.forEach(c => scene.remove(c));
            objects = [];
            chunks = [];
            
            // Reset Vars
            score = 0;
            coinCount = 0;
            distanceTraveled = 0;
            gameSpeed = SPEED_BASE;
