<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers Clone</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            color: white;
            text-shadow: 2px 2px 0px #000;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            z-index: 20;
        }
        button {
            background: #ffcc00;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            font-weight: bold;
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 14px; color: #ddd; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-item">
            <span class="label">SCORE</span>
            <span id="score">0</span>
        </div>
        <div class="hud-item">
            <span class="label">HIGHSCORE</span>
            <span id="highscore">0</span>
        </div>
        <div class="hud-item">
            <span class="label">COINS</span>
            <span id="coins">0</span>
        </div>
    </div>

    <div id="game-over">
        <h1>BUSTED!</h1>
        <p>Police caught you!</p>
        <p>Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">RUN AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- GAME VARIABLES ---
        let scene, camera, renderer;
        let player, police;
        let tracks = [];
        let obstacles = []; // Trains and Barriers
        let coins = [];
        let particleSystem;
        
        // State
        let gameActive = true;
        let score = 0;
        let coinCount = 0;
        let gameSpeed = 15;
        let clock = new THREE.Clock();
        
        // Player Movement
        let currentLane = 0; // -1 (left), 0 (center), 1 (right)
        const laneWidth = 3;
        let isJumping = false;
        let isSliding = false;
        let verticalVelocity = 0;
        const gravity = -30;
        const jumpForce = 12;
        const playerYBase = 1;

        // Audio Context (Synthesized sounds)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'coin') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky Blue
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 5, 8);
            camera.lookAt(0, 0, -10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 2. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            // 3. Environment (Tracks & Floor)
            createEnvironment();

            // 4. Player (The Surfer) - Using a group for animation scaling
            player = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(1, 1, 0.5);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Red Shirt
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            
            // Head
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshLambertMaterial({ color: 0xffccaa }); // Skin
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.3;
            
            // Cap
            const capGeo = new THREE.BoxGeometry(0.65, 0.2, 0.7);
            const capMat = new THREE.MeshLambertMaterial({ color: 0x333333 }); 
            const cap = new THREE.Mesh(capGeo, capMat);
            cap.position.y = 1.6;

            player.add(body);
            player.add(head);
            player.add(cap);
            
            player.position.y = playerYBase;
            scene.add(player);

            // 5. Police & Dog (Chaser)
            police = new THREE.Group();
            const policeGeo = new THREE.BoxGeometry(1, 1.5, 0.5);
            const policeMat = new THREE.MeshLambertMaterial({ color: 0x000088 }); // Blue Uniform
            const policeMesh = new THREE.Mesh(policeGeo, policeMat);
            policeMesh.position.y = 0.75;
            police.add(policeMesh);
            
            // Dog
            const dogGeo = new THREE.BoxGeometry(0.5, 0.5, 0.8);
            const dogMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Brown
            const dog = new THREE.Mesh(dogGeo, dogMat);
            dog.position.set(0.8, 0.25, 0);
            police.add(dog);

            police.position.set(0, 0, 4); // Behind player
            scene.add(police);

            // Controls
            document.addEventListener('keydown', handleInput);
            window.addEventListener('resize', onWindowResize, false);

            // Load high score
            const savedHigh = localStorage.getItem('subwayHigh');
            if(savedHigh) document.getElementById('highscore').innerText = savedHigh;

            animate();
        }

        function createEnvironment() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(100, 200);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0xeebb99 }); // Sand/Dirt
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -50;
            scene.add(ground);

            // Tracks (Visual only, we use logic for lanes)
            for(let i=-1; i<=1; i++) {
                const trackGeo = new THREE.BoxGeometry(1, 0.1, 200);
                const trackMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
                const track = new THREE.Mesh(trackGeo, trackMat);
                track.position.set(i * laneWidth, 0.05, -50);
                scene.add(track);

                // Sleepers
                for(let j=0; j<50; j++) {
                    const sleepGeo = new THREE.BoxGeometry(2, 0.1, 0.5);
                    const sleepMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                    const sleeper = new THREE.Mesh(sleepGeo, sleepMat);
                    sleeper.position.set(i * laneWidth, 0.1, -j * 4 + 10);
                    scene.add(sleeper);
                }
            }
            
            // Buildings/Scenery
            for(let k=0; k<20; k++) {
                const h = Math.random() * 10 + 5;
                const buildingGeo = new THREE.BoxGeometry(5, h, 5);
                const buildingMat = new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xcc6600 : 0xcccccc });
                const mesh = new THREE.Mesh(buildingGeo, buildingMat);
                mesh.position.set(k%2===0 ? -15 : 15, h/2, -k * 10);
                scene.add(mesh);
            }
        }

        function handleInput(e) {
            if (!gameActive) return;

            switch(e.key) {
                case 'ArrowLeft':
                case 'a':
                    if (currentLane > -1) currentLane--;
                    break;
                case 'ArrowRight':
                case 'd':
                    if (currentLane < 1) currentLane++;
                    break;
                case 'ArrowUp':
                case 'w':
                case ' ':
                    if (!isJumping && !isSliding) {
                        verticalVelocity = jumpForce;
                        isJumping = true;
                        playSound('jump');
                    }
                    break;
                case 'ArrowDown':
                case 's':
                    if (!isJumping && !isSliding) {
                        isSliding = true;
                        // Squash animation
                        player.scale.y = 0.5; 
                        setTimeout(() => {
                            isSliding = false;
                            player.scale.y = 1;
                        }, 800);
                    }
                    break;
            }
        }

        function spawnObstacle() {
            const type = Math.random();
            const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, 1
            const zPos = -100;

            if (type < 0.3) {
                // TRAIN
                const geo = new THREE.BoxGeometry(2.5, 4, 15);
                const mat = new THREE.MeshStandardMaterial({ color: 0xcc0000, metalness: 0.6 });
                const train = new THREE.Mesh(geo, mat);
                train.position.set(lane * laneWidth, 2, zPos);
                train.castShadow = true;
                train.userData = { type: 'train', active: true };
                
                // Add lights to train
                const light = new THREE.PointLight(0xffff00, 1, 10);
                light.position.set(0, 0, 7.5);
                train.add(light);
                
                scene.add(train);
                obstacles.push(train);

            } else if (type < 0.6) {
                // BARRIER
                const geo = new THREE.BoxGeometry(2.5, 1, 0.5);
                const mat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                const barrier = new THREE.Mesh(geo, mat);
                barrier.position.set(lane * laneWidth, 0.5, zPos);
                barrier.castShadow = true;
                barrier.userData = { type: 'barrier', active: true };
                scene.add(barrier);
                obstacles.push(barrier);
            } else {
                // COINS (Spawn a row of 3)
                for(let i=0; i<3; i++) {
                    const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                    const mat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                    const coin = new THREE.Mesh(geo, mat);
                    coin.rotation.z = Math.PI / 2;
                    // Some high, some low
                    const yPos = Math.random() > 0.5 ? 3 : 1; 
                    coin.position.set(lane * laneWidth, yPos, zPos - (i*3));
                    coin.userData = { active: true };
                    scene.add(coin);
                    coins.push(coin);
                }
            }
        }

        function updatePhysics(delta) {
            // Lane Interpolation (Smooth side movement)
            const targetX = currentLane * laneWidth;
            player.position.x += (targetX - player.position.x) * 10 * delta;

            // Gravity & Jump
            if (isJumping) {
                player.position.y += verticalVelocity * delta;
                verticalVelocity += gravity * delta;
                
                if (player.position.y <= playerYBase) {
                    player.position.y = playerYBase;
                    isJumping = false;
                    verticalVelocity = 0;
                }
            }
            
            // Police follows player x (delayed)
            police.position.x += (player.position.x - police.position.x) * 2 * delta;
        }

        function updateGameObjects(delta) {
            // Move Obstacles
            obstacles.forEach((obj, index) => {
                obj.position.z += gameSpeed * delta;
                
                // Train moves faster towards player
                if(obj.userData.type === 'train') {
                     obj.position.z += 5 * delta; 
                }

                // Collision Detection
                const playerBox = new THREE.Box3().setFromObject(player);
                const objBox = new THREE.Box3().setFromObject(obj);
                
                // Shrink player box slightly for forgiveness
                playerBox.expandByScalar(-0.2); 

                if (playerBox.intersectsBox(objBox)) {
                    gameOver();
                }

                // Cleanup
                if (obj.position.z > 10) {
                    scene.remove(obj);
                    obstacles.splice(index, 1);
                    score += 10;
                    document.getElementById('score').innerText = Math.floor(score);
                }
            });

            // Move Coins
            coins.forEach((coin, index) => {
                coin.position.z += gameSpeed * delta;
                coin.rotation.x += 3 * delta; // Spin

                const playerBox = new THREE.Box3().setFromObject(player);
                const coinBox = new THREE.Box3().setFromObject(coin);

                if (playerBox.intersectsBox(coinBox)) {
                    playSound('coin');
                    scene.remove(coin);
                    coins.splice(index, 1);
                    coinCount++;
                    score += 50;
                    document.getElementById('coins').innerText = coinCount;
                    document.getElementById('score').innerText = Math.floor(score);
                }

                if (coin.position.z > 10) {
                    scene.remove(coin);
                    coins.splice(index, 1);
                }
            });
        }

        function gameOver() {
            gameActive = false;
            playSound('crash');
            
            // Police catches player animation (simple snap)
            police.position.z = player.position.z - 1;
            police.position.x = player.position.x;
            
            document.getElementById('final-score').innerText = Math.floor(score);
            document.getElementById('game-over').style.display = 'block';

            // Check highscore
            const currentHigh = localStorage.getItem('subwayHigh') || 0;
            if (score > currentHigh) {
                localStorage.setItem('subwayHigh', Math.floor(score));
                document.getElementById('highscore').innerText = Math.floor(score);
            }
        }

        function resetGame() {
            // Remove old objects
            obstacles.forEach(o => scene.remove(o));
            coins.forEach(c => scene.remove(c));
            obstacles = [];
            coins = [];
            
            score = 0;
            coinCount = 0;
            gameSpeed = 15;
            currentLane = 0;
            
            document.getElementById('score').innerText = '0';
            document.getElementById('coins').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
            
            police.position.z = 4;
            gameActive = true;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                const delta = clock.getDelta();
                
                updatePhysics(delta);
                updateGameObjects(delta);
                
                // Spawn logic
                if (Math.random() < 0.02) spawnObstacle();

                // Increase speed over time
                gameSpeed += 0.001;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        init();

    </script>
</body>
</html>
